<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset password</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="container">
  <div class="card" style="max-width:380px;margin:80px auto;">
    <h2>Set a new password</h2>
    <div id="form-block">
      <label>New password</label>
      <input id="new-password" type="password" autocomplete="new-password" />
      <label>Confirm new password</label>
      <input id="confirm-password" type="password" autocomplete="new-password" />
      <div style="margin-top:16px;"><button id="submit-btn" style="width:100%;">Update password</button></div>
    </div>
    <p id="msg" class="tag" style="margin-top:12px;"></p>
    <p style="margin-top:8px;"><a href="index.html" class="tag">Back to sign in</a></p>
  </div>
</div>
<script>
const params = new URLSearchParams(window.location.search);
const token = params.get('token');
const msg = document.getElementById('msg');

if (!token) {
  document.getElementById('form-block').classList.add('hidden');
  msg.textContent = 'Missing or invalid reset link.';
  msg.style.color = 'var(--red)';
}

document.getElementById('submit-btn').addEventListener('click', async () => {
  const p1 = document.getElementById('new-password').value;
  const p2 = document.getElementById('confirm-password').value;

  if (p1.length < 10) { msg.textContent = 'Password must be at least 10 characters.'; msg.style.color = 'var(--red)'; return; }
  if (p1 !== p2) { msg.textContent = 'Passwords do not match.'; msg.style.color = 'var(--red)'; return; }

  msg.textContent = 'Updating...'; msg.style.color = 'var(--text-dim)';
  try {
    const res = await fetch('/api/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, new_password: p1 }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error?.message || (typeof data.error === 'string' ? data.error : 'Reset failed'));
    msg.textContent = data.message + ' Redirecting to sign in...';
    msg.style.color = 'var(--green)';
    document.getElementById('form-block').classList.add('hidden');
    setTimeout(() => { window.location.href = 'index.html'; }, 2000);
  } catch (err) {
    msg.textContent = err.message;
    msg.style.color = 'var(--red)';
  }
});
</script>
</body>
</html>
